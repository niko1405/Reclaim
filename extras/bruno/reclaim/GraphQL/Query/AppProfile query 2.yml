info:
  name: AppProfile query 2
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: Accept
      value: application/graphql-response+json
  body:
    query: |-
      query FindProfilesByMultipleFilters($input: SuchParameterInput) {
        appProfiles(input: $input) {
          id
          displayName
          timezone
          currentStreak
        }
      }
    variables: |-
      {
        "input": {
          "timezone": "Europe/Berlin",
          "currentStreak": 5
        }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/graphql-response\+json(; charset=utf-8)?$

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
