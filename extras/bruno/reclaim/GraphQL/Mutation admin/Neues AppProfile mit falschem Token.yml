info:
  name: Neues AppProfile mit falschem Token
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: Accept
      value: application/graphql-response+json
  body:
    query: |-
      mutation CreateProfile($input: AppProfilePostInput!) {
        create(input: $input) {
          id
        }
      }
    variables: |-
      {
        "input": {
          "displayName": "GraphQL Native Ninja",
          "avatarUrl": "https://api.dicebear.com/7.x/avataaars/svg?seed=GraphQL",
          "statusMessage": "Jetzt läuft es sauber getrennt!",
          "timezone": "Europe/Berlin",
          "currentStreak": 5,
          "onboardingCompleted": true,
          "trackingConfig": {
            "dailyLimitMinutes": 45,
            "isPublic": true,
            "notificationsEnabled": true
          },
          "screentimeLogs": [
            {
              "logDate": "2026-06-04",
              "totalMinutes": 15,
              "topApp": "Bruno Client"
            }
          ]
        }
      }
  auth:
    type: bearer
    token: "{{TOKEN}}x"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/graphql-response\+json(; charset=utf-8)?$
    - expression: res.body.errors
      operator: isArray
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].path
      operator: isArray
    - expression: res.body.errors[0].path
      operator: length
      value: "1"
    - expression: res.body.errors[0].path[0]
      operator: eq
      value: create

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
