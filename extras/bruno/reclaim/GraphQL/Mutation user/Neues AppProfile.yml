info:
  name: Neues AppProfile
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: Accept
      value: application/graphql-response+json
  body:
    query: |-
      mutation CreateProfile($input: AppProfilePostInput!) {
        create(input: $input) {
          id
        }
      }
    variables: |-
      {
        "input": {
          "displayName": "GraphQL Native Ninja",
          "avatarUrl": "https://api.dicebear.com/7.x/avataaars/svg?seed=GraphQL",
          "statusMessage": "Jetzt läuft es sauber getrennt!",
          "timezone": "Europe/Berlin",
          "currentStreak": 5,
          "onboardingCompleted": true,
          "trackingConfig": {
            "dailyLimitMinutes": 45,
            "isPublic": true,
            "notificationsEnabled": true
          },
          "screentimeLogs": [
            {
              "logDate": "2026-06-04",
              "totalMinutes": 15,
              "topApp": "Bruno Client"
            }
          ]
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('Body mit id', () => {
          const { data } = res.getBody();
          const id = parseInt(data.create.id, 10);
          expect(id).to.be.gte(0);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/graphql-response\+json(; charset=utf-8)?$
    - expression: res.body.data.create
      operator: isJson
    - expression: res.body.data.create.id
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
