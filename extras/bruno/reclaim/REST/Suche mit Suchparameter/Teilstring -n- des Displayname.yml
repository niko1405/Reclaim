info:
  name: Teilstring "n" des Displayname
  type: http
  seq: 4

http:
  method: GET
  url: "{{restUrl}}?displayName=n"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: displayName
      value: n
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('Body: displayName enthaelt "n" (ignore case) und ID', () => {
          res.getBody()
            .content
            .forEach(p => {
              const { displayName, id } = p;
              
              // Typ-Prüfung bleibt gleich
              expect(displayName).to.be.a('string');
              
              // In Kleinbuchstaben umwandeln und prüfen
              expect(displayName.toLowerCase()).to.include('n');
            });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/json(; charset=utf-8)?$
    - expression: res.body.content
      operator: isArray
    - expression: res.body.content
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
