info:
  name: Nicht-vorhandener Teilstring des Displayname
  type: http
  seq: 6

http:
  method: GET
  url: "{{restUrl}}?displayName=xxx"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: displayName
      value: xxx
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
