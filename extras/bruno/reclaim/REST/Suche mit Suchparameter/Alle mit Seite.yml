info:
  name: Alle mit Seite
  type: http
  seq: 2

http:
  method: GET
  url: "{{restUrl}}?page=1"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/json(; charset=utf-8)?$
    - expression: res.body.content
      operator: isArray
    - expression: res.body.content
      operator: isNotEmpty
    - expression: res.body.page.number
      operator: eq
      value: "0"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
