info:
  name: New Access Token Invalid Password
  type: http
  seq: 4

http:
  method: POST
  url: "{{oidcTokenUrl}}"
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: password
      - name: username
        value: "{{username}}"
      - name: password
        value: wrong
  auth:
    type: basic
    username: "{{clientId}}"
    password: "{{clientSecret}}"

runtime:
  variables:
    - name: username
      value: admin
    - name: clientId
      value: javascript-client
    - name: clientSecret
      value: vDorIIwidFF8mjrgIWoLMR7mOY0mC1mr
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
